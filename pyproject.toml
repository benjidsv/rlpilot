[project]
name = "rlpilot"
version = "0.1.0"
description = "Gymnasium environment for Speed Dreams (TORCS fork) RL driving"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "gymnasium>=1.1"]

[project.optional-dependencies]
train = ["stable-baselines3>=2.4", "mlflow>=2.16", "torch>=2.4", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/rlpilot"]
